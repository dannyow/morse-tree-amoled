; Morse firmware for the Waveshare ESP32-C6-Touch-AMOLED-2.16.
; Toolchain pinned to one pioarduino release, so builds are reproducible.
;
; Sources live in platform/ (hardware) and src/ (the app). src_dir = . puts firmware/
; on the include path, so "platform/board.h" resolves from anywhere.
[platformio]
default_envs = morse
src_dir = .

[env:morse]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitc-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = no_ota_16mb.csv
monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    -<*>
    +<platform/*>
    +<src/*>

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -O2

lib_deps =
    moononournation/GFX Library for Arduino
    lewisxhe/XPowersLib
    lewisxhe/SensorLib

